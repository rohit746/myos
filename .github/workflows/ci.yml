name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and boot-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags are needed for the version string

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang lld xorriso qemu-system-x86 ovmf make mtools dosfstools
          clang --version | head -1
          ld.lld --version
          qemu-system-x86_64 --version | head -1

      - name: Build (warnings are errors)
        run: make EXTRA_CFLAGS=-Werror

      - name: Boot test (UEFI + BIOS)
        run: make test

      - name: Crash-screen test
        run: make test-crash EXTRA_CFLAGS=-Werror

      - name: Kernel unit tests (KTEST)
        run: make test-kernel EXTRA_CFLAGS=-Werror

      - name: Network test (DHCP, ARP, ping, closed ports)
        run: make test-net

      - name: Upload ISO and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: myos-${{ github.sha }}
          path: |
            build/myos.iso
            build/kernel.elf
            build/test/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: myos-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          mv myos.iso "myos-$TAG.iso"
          mv kernel.elf "kernel-$TAG.elf"
          sha256sum "myos-$TAG.iso" "kernel-$TAG.elf" > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "myos $TAG" --generate-notes \
            "myos-$TAG.iso" "kernel-$TAG.elf" SHA256SUMS
